# Chamber (case) materials. All SI. Adding a material = one entry here, no code change.
#
# tensile_strength        : ultimate tensile strength [Pa]
# yield_strength          : tensile yield [Pa] (falls back to 0.9 * tensile if omitted)
# print_direction_factor  : knock-down for load normal to the print layers.
#                           Overridden at analysis time by the chosen print method
#                           (FDM 0.5, SLS 0.9) for thermoplastics; 1.0 for wrought metal.
# elastic_modulus         : Young's modulus [Pa]
# density                 : [kg/m^3]
# thermal_conductivity    : k [W/(m*K)]
# specific_heat           : c_p [J/(kg*K)]
# glass_transition        : T_g [K] (melting point for metals)
# max_service_temp        : continuous-use limit [K]
# notes_key               : i18n key for the caveat text shown in the UI

materials:
  - id: pla
    name_en: "PLA (FDM)"
    name_tr: "PLA (FDM)"
    tensile_strength: 50.0e6
    yield_strength: 45.0e6
    print_direction_factor: 0.5
    elastic_modulus: 3.5e9
    density: 1240
    thermal_conductivity: 0.13
    specific_heat: 1800
    glass_transition: 333
    max_service_temp: 318
    notes_key: "material.pla.notes"

